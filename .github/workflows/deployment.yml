name: Scholar Backend Deployment

on:
  push:
    branches: [production]

env:
  PROJECT_NAME: scholar-backend
  BRANCH_NAME: ${{ github.ref_name }}
  RUN_NUMBER: ${{ github.run_number }}
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
  SSH_HOST: ${{ secrets[format('SSH_HOST_{0}', github.ref_name)] }}
  SSH_USER: ${{ secrets[format('SSH_USER_{0}', github.ref_name)] }}
  SSH_PASS: ${{ secrets[format('SSH_PASS_{0}', github.ref_name)] }}
  SSH_KEY: ${{ secrets[format('SSH_KEY_{0}', github.ref_name)] }}
  APP_ENV: ${{ secrets[format('APP_ENV_{0}', github.ref_name)] }}
  NODE_ENV: ${{ github.ref_name }}
  WORKDIR: /app
  SSH_KEY_PATH: /tmp/${{ github.event.repository.name }}_${{ github.ref_name }}_${{ github.run_number }}/ssh_key.pem
  BUILD_NAME_SHORT: ${{ github.event.repository.name }}_${{ github.ref_name }}
  BUILD_NAME_LONG: ${{ github.event.repository.name }}_${{ github.ref_name }}_${{ github.run_number }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          platforms: linux/arm64

      - name: Copy code to action's temporary directory
        run: |
          mkdir -p /tmp/${{ env.BUILD_NAME_LONG }}
          cp -r . /tmp/${{ env.BUILD_NAME_LONG }}/
          cd /tmp/${{ env.BUILD_NAME_LONG }}
          rm -rf .git .github .vscode node_modules
          echo "${{ env.APP_ENV }}" > .env.${{ env.NODE_ENV }}
          echo "GITHUB_RUN_NUMBER=${{ env.RUN_NUMBER }}" >> .env.${{ env.NODE_ENV }}
          echo "GITHUB_COMMIT_MESSAGE=$(echo '${{ env.COMMIT_MESSAGE }}' | tr -d '\n\r' | sed 's/[^a-zA-Z0-9 ._-]//g')" >> .env.${{ env.NODE_ENV }}

      - name: Zip the source-code
        run: |
          cd /tmp/${{ env.BUILD_NAME_LONG }}
          zip -r ${{ env.BUILD_NAME_LONG }}.zip .

      - name: Save the SSH_KEY to the action's temporary directory
        run: |
          echo "${{ env.SSH_KEY }}" > ${{ env.SSH_KEY_PATH }}
          chmod 600 ${{ env.SSH_KEY_PATH }}

      - name: Add host to known hosts on action's server
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create required directories on VM
        run: |
          ssh -i ${{ env.SSH_KEY_PATH }} ${{ env.SSH_USER }}@${{ env.SSH_HOST }} << 'EOF'
            set -e  # Exit immediately on error
            set -u  # Treat unset variables as error
            mkdir -p ~/data/projects/${{ env.PROJECT_NAME }}/${{ env.BUILD_NAME_LONG }}
          EOF

      - name: Send the zipped source-code to the VM
        run: |
          cd /tmp/${{ env.BUILD_NAME_LONG }}
          scp -i ${{ env.SSH_KEY_PATH }} -r ${{ env.BUILD_NAME_LONG }}.zip ${{ env.SSH_USER }}@${{ env.SSH_HOST }}:~/data/projects/${{ env.PROJECT_NAME }}/${{ env.BUILD_NAME_LONG }}.zip

      - name: Unzip the source-code on the VM and remove the zip file
        run: |
          ssh -i ${{ env.SSH_KEY_PATH }} ${{ env.SSH_USER }}@${{ env.SSH_HOST }} << 'EOF'
            set -e  # Exit immediately on error
            set -u  # Treat unset variables as error

            # Install unzip if not present
            if ! command -v unzip &> /dev/null; then
              sudo apt-get update && sudo apt-get install -y unzip
            fi

            cd ~/data/projects/${{ env.PROJECT_NAME }}

            # Remove existing build directory and extract fresh
            rm -rf ${{ env.BUILD_NAME_LONG }}
            mkdir -p ${{ env.BUILD_NAME_LONG }}
            unzip -o ${{ env.BUILD_NAME_LONG }}.zip -d ${{ env.BUILD_NAME_LONG }}
            rm -f ${{ env.BUILD_NAME_LONG }}.zip
          EOF

      - name: Deploy with Docker Compose
        run: |
          ssh -i ${{ env.SSH_KEY_PATH }} ${{ env.SSH_USER }}@${{ env.SSH_HOST }} << 'EOF'
            set -e  # Exit immediately on error
            set -u  # Treat unset variables as error
            
            # Go to the project directory
            cd ~/data/projects/${{ env.PROJECT_NAME }}/${{ env.BUILD_NAME_LONG }}

            # Verify the env file exists
            if [ ! -f ".env.${{ env.NODE_ENV }}" ]; then
              echo "Error: .env.${{ env.NODE_ENV }} not found after extraction"
              ls -la
              exit 1
            fi

            # Build the new image first (without starting container)
            echo "Building Docker image... ${{ env.BUILD_NAME_LONG }}"
            sudo docker compose --env-file=.env.${{ env.NODE_ENV }} -p ${{ env.BUILD_NAME_LONG }} build --no-cache

            # If build succeeded, stop and remove old container (matching BUILD_NAME_SHORT pattern)
            echo "Stopping old container matching pattern: ${{ env.BUILD_NAME_SHORT }}"
            sudo docker ps -a --filter "name=${{ env.BUILD_NAME_SHORT }}*" --format "{{.Names}}" | xargs -r sudo docker rm -f

            # Start the new container
            echo "Starting container... ${{ env.BUILD_NAME_LONG }}"
            sudo docker compose --env-file=.env.${{ env.NODE_ENV }} -p ${{ env.BUILD_NAME_LONG }} up -d
          EOF